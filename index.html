<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кликер Бита — песочница HTML, CSS и JS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#EEF1F6;color:#1F2937;font-size:16px;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
header{background:#0E1726;color:#F4F6F9;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header h1{margin:0;font-size:19px;white-space:nowrap}
.name{background:#16233A;border:1px solid #334155;color:#F4F6F9;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;width:170px}
.badge{display:flex;align-items:center;gap:6px;background:#16233A;border:1px solid #334155;border-radius:20px;padding:4px 12px 4px 6px;font-weight:700;font-size:15px;white-space:nowrap}
.badge i{font-style:normal;font-size:20px}
.prog{flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
.prog .bar{flex:1;height:12px;background:#26344A;border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:#4ADE80;transition:width .4s}
.mono{font-family:Consolas,"Courier New",monospace}
.prog b{min-width:56px;text-align:right}
.clock{color:#A9B6C8;font-size:14px}
.hbtn{background:transparent;color:#F4F6F9;border:1px solid #475569;border-radius:8px;padding:6px 10px;font-size:14px;white-space:nowrap}
.hbtn:hover{background:#1B2A40}
.hbtn.hl{background:#F59E0B;color:#0E1726;border-color:#F59E0B;font-weight:700}
.bugbar{background:#7C2D12;color:#FFEDD5;padding:6px 14px;font-size:14px;display:flex;gap:12px;align-items:center}
.bugbar[hidden]{display:none}
main{flex:1;display:grid;grid-template-columns:360px minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.steps{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;user-select:none;-webkit-user-select:none}
.legend{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;background:#F6F8FB;border-radius:10px;padding:8px 10px}
.gh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#475569;margin-top:6px;text-transform:uppercase;letter-spacing:.5px}
.gh .lockic{margin-left:auto;font-size:12px;text-transform:none;letter-spacing:0;font-weight:500}
.step{border:2px solid #D5DCE6;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.step.cur{border-color:#1D4ED8;box-shadow:0 0 0 2px #1D4ED8 inset}
.step.done{border-color:#16A34A;background:#F0FDF4}
.step.lock{opacity:.45}
.step .top{display:flex;gap:8px;align-items:center}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.step.done .num{background:#16A34A!important}
.step .t{font-weight:700;font-size:15px;line-height:1.25}
.step .d{font-size:14px;line-height:1.4;color:#374151}
.hints{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{border:2px solid #D5DCE6;background:#fff;border-radius:8px;padding:5px 10px;font-size:13.5px}
.sbtn:disabled{opacity:.4;cursor:default}
.sbtn.pri{background:#1D4ED8;border-color:#1D4ED8;color:#fff;font-weight:600}
.sbtn.warn{background:#FEF3C7;border-color:#B45309;color:#7C2D12;font-weight:600}
.words{font-size:14px;line-height:1.45;background:#FEF9C3;border-radius:8px;padding:8px 10px}
.cv{background:#0E1726;border-radius:8px;overflow:auto;padding:4px 0}
.cv canvas{display:block}
.cvl{font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:1px 6px;display:inline-block;margin:2px 0}
.res{font-size:14px;font-weight:600;line-height:1.4}
.res.ok{color:#16A34A} .res.bad{color:#B91C1C}
.cmp{margin:0;background:#FFF7ED;border:1px solid #FDBA74;border-radius:8px;padding:8px 10px;font:13px/1.45 Consolas,"Courier New",monospace;white-space:pre;overflow:auto;user-select:none}
.L-html{background:#E34F26} .L-css{background:#1D6FD8} .L-js{background:#B08A00} .L-x{background:#7C3AED}
.tagL{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;color:#fff;margin-left:auto;white-space:nowrap}
.tabs{display:flex;background:#F6F8FB;border-bottom:1px solid #D5DCE6}
.tab{flex:1;border:0;background:transparent;padding:9px 6px;font-weight:700;font-size:15px;border-bottom:4px solid transparent;color:#5B6678}
.tab[aria-selected="true"]{color:#0E1726;background:#fff}
.tab.html[aria-selected="true"]{border-color:#E34F26} .tab.css[aria-selected="true"]{border-color:#1D6FD8} .tab.js[aria-selected="true"]{border-color:#B08A00}
.tab small{display:block;font-weight:500;font-size:11px}
.ed{flex:1;display:flex;min-height:0}
.nums{background:#F6F8FB;color:#94A3B8;font:15px/1.5 Consolas,"Courier New",monospace;padding:10px 6px;text-align:right;user-select:none;overflow:hidden;min-width:40px;white-space:pre}
textarea{flex:1;border:0;outline:0;resize:none;padding:10px 12px;font:15px/1.5 Consolas,"Courier New",monospace;color:#0E1726;background:#fff;tab-size:2;white-space:pre;overflow:auto}
textarea[hidden]{display:none}
.err{background:#FEE2E2;color:#991B1B;padding:8px 12px;font-size:14px;border-top:2px solid #F87171}
.err[hidden]{display:none}
.phead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#F6F8FB;border-bottom:1px solid #D5DCE6;font-weight:700}
.phead span{flex:1}
iframe{flex:1;border:0;width:100%;background:#fff}
.modal{position:fixed;inset:0;background:rgba(6,11,20,.75);display:grid;place-items:center;z-index:9;padding:16px}
.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:18px;padding:24px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.mbox h2{margin:0;font-size:24px}
.mbox .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.big{font-size:72px;line-height:1}
.teacher .who{font-size:34px;font-weight:800;color:#0E1726}
.teacher .lv{font-size:28px;font-weight:700}
.teacher ul{list-style:none;margin:0;padding:0;text-align:left;font-size:18px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0E1726;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
@media (max-width:1100px){main{grid-template-columns:320px minmax(0,1fr)}.prev{grid-column:1/-1;min-height:360px}}
@media (max-width:700px){main{grid-template-columns:1fr}.col{min-height:320px}}
</style>
</head>
<body>
<header>
  <h1>Кликер Бита 🤖</h1>
  <input class="name" id="name" placeholder="Имя и фамилия" aria-label="Имя и фамилия" autocomplete="off">
  <span class="badge" id="badge"><i>🎒</i><span>Стажёр</span></span>
  <div class="prog"><div class="bar"><i id="pbar"></i></div><b class="mono" id="ptxt">0 / 16</b><span class="clock mono" id="clock">00:00</span></div>
  <button class="hbtn hl" id="teach">👀 Показать учителю</button>
  <button class="hbtn" id="save">💾 Скачать игру</button>
  <button class="hbtn" id="restart">↺ Заново</button>
</header>
<div class="bugbar" id="bugbar" hidden>🐞 Сейчас в редакторе чужой код с багами. Твоя игра сохранена.<button class="sbtn" id="backTop">Вернуться к моей игре</button></div>
<main>
  <section class="col"><div class="steps" id="steps"></div></section>
  <section class="col">
    <div class="tabs" role="tablist">
      <button class="tab html" data-l="html" aria-selected="true">HTML<small>каркас</small></button>
      <button class="tab css" data-l="css" aria-selected="false">CSS<small>оформление</small></button>
      <button class="tab js" data-l="js" aria-selected="false">JS<small>поведение</small></button>
    </div>
    <div class="ed"><div class="nums" id="nums">1</div>
      <textarea id="t-html" spellcheck="false" aria-label="Код HTML"></textarea>
      <textarea id="t-css" spellcheck="false" aria-label="Код CSS" hidden></textarea>
      <textarea id="t-js" spellcheck="false" aria-label="Код JavaScript" hidden></textarea>
    </div>
    <div class="err" id="err" hidden></div>
  </section>
  <section class="col prev">
    <div class="phead"><span>Твоя страница — обновляется сама</span><button class="sbtn" id="reload">↻ Перезапустить</button></div>
    <iframe id="view" title="Предпросмотр страницы"></iframe>
  </section>
</main>
<div class="modal" id="mConfirm" hidden><div class="mbox"><div class="big">⚠️</div><h2>Стереть всё и начать заново?</h2><p>Пропадут код, шаги и значки. Чтобы сохранить игру, сначала нажми «Скачать игру».</p><div class="acts"><button class="sbtn pri" id="yes">Да, начать заново</button><button class="sbtn" id="no">Нет, вернуться</button></div></div></div>
<div class="modal" id="mWin" hidden><div class="mbox"><div class="big" id="winIc">🏆</div><h2 id="winT"></h2><p id="winP"></p><div class="acts"><button class="sbtn pri" id="winOk">Дальше</button></div></div></div>
<div class="modal" id="mTeach" hidden><div class="mbox teacher"><div class="big" id="tIc">🎒</div><div class="who" id="tName"></div><div class="lv" id="tLv"></div><ul id="tList"></ul><div class="mono" id="tTime"></div><div class="acts"><button class="sbtn pri" id="tOk">Закрыть</button></div></div></div>
<div class="toast" id="toast" hidden></div>
<iframe id="probe" title="проверка" style="position:absolute;width:420px;height:320px;left:-9999px;top:0" aria-hidden="true" tabindex="-1"></iframe>
